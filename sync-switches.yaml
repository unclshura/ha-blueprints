blueprint:
  name: Master/Slave Switch Sync (Pure Template Version)
  description: >
    Master physical switch controls a dumb ceiling light.
    Slave logical switches invert the master and show indicator state.
  domain: automation

  input:
    master_switch:
      name: Master physical switch (SW1)
      selector:
        entity:
          domain: switch

    slave_devices:
      name: Slave devices (button + indicator)
      selector:
        entity:
          domain: light

    lock_boolean:
      name: Lock boolean to prevent recursion
      selector:
        entity:
          domain: input_boolean

mode: single

triggers:
  - id: master_changed
    trigger: state
    entity_id: "{{ master_switch }}"
    to: ["on", "off"]

  - id: slave_changed
    trigger: state
    entity_id: >
      {% for s in slave_devices %}
      {{ s }}
      {% endfor %}
    to: ["on", "off"]

actions:
  - variables:
      master_switch: !input master_switch
      slave_devices: !input slave_devices
      lock_boolean: !input lock_boolean

  - condition: template
    value_template: "{{ is_state(lock_boolean, 'off') }}"

  - action: input_boolean.turn_on
    target:
      entity_id: "{{ lock_boolean }}"

  - choose:

      - conditions:
          - condition: trigger
            id: master_changed
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master_switch, 'on') }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: >
                        {% for s in slave_devices %}
                        {{ s }}
                        {% endfor %}

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master_switch, 'off') }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: >
                        {% for s in slave_devices %}
                        {{ s }}
                        {% endfor %}

      - conditions:
          - condition: trigger
            id: slave_changed
        sequence:
          - action: switch.toggle
            target:
              entity_id: "{{ master_switch }}"

          - delay: "00:00:01"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master_switch, 'on') }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: >
                        {% for s in slave_devices %}
                        {{ s }}
                        {% endfor %}

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master_switch, 'off') }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: >
                        {% for s in slave_devices %}
                        {{ s }}
                        {% endfor %}

  - delay: "00:00:01"

  - action: input_boolean.turn_off
    target:
      entity_id: "{{ lock_boolean }}"
