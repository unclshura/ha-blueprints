blueprint:
  name: Master/Slave Switch Sync (2)
  description: >
    Master physical switch controls a dumb ceiling light.
    Slave logical switches invert the master and show indicator state.
  domain: automation

  input:
    master_switch:
      name: Master physical switch (SW1)
      selector:
        entity:
          domain: switch

    slave_devices:
      name: Slave devices (button + indicator)
      selector:
        target:
          entity:
            domain: light

    lock_boolean:
      name: Lock boolean to prevent recursion
      selector:
        entity:
          domain: input_boolean

mode: single

triggers:
  - id: master_changed
    trigger: state
    entity_id: !input master_switch
    to: ["on", "off"]

  - id: slave_changed
    trigger: state
    entity_id: !input slave_devices
    to: ["on", "off"]

actions:
  - variables:
      master: !input master_switch
      slaves: !input slave_devices        # full target object
      lock: !input lock_boolean

  ###########################################################################
  # RECURSION LOCK CHECK
  ###########################################################################
  - condition: template
    value_template: "{{ is_state(lock, 'off') }}"

  ###########################################################################
  # LOCK
  ###########################################################################
  - action: input_boolean.turn_on
    target:
      entity_id: "{{ lock }}"

  ###########################################################################
  # MAIN LOGIC
  ###########################################################################
  - choose:

      #######################################################################
      # 1. MASTER SWITCH CHANGED → update slave indicators
      #######################################################################
      - conditions:
          - condition: trigger
            id: master_changed
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master, 'on') }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: >
                        {% for s in slaves.entity_id %}
                        {{ s }}
                        {% endfor %}

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master, 'off') }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: >
                        {% for s in slaves.entity_id %}
                        {{ s }}
                        {% endfor %}

      #######################################################################
      # 2. SLAVE SWITCH PRESSED → invert master + update indicators
      #######################################################################
      - conditions:
          - condition: trigger
            id: slave_changed
        sequence:
          - action: switch.toggle
            target:
              entity_id: "{{ master }}"

          - delay: "00:00:01"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master, 'on') }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: >
                        {% for s in slaves.entity_id %}
                        {{ s }}
                        {% endfor %}

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(master, 'off') }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: >
                        {% for s in slaves.entity_id %}
                        {{ s }}
                        {% endfor %}

  ###########################################################################
  # FINAL DELAY BEFORE UNLOCK
  ###########################################################################
  - delay: "00:00:01"

  ###########################################################################
  # UNLOCK
  ###########################################################################
  - action: input_boolean.turn_off
    target:
      entity_id: "{{ lock }}"
