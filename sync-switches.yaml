blueprint:
  name: Master/Slave Switch Sync (Single Slave List)
  description: >
    Master physical switch controls a dumb ceiling light.
    Slave logical switches invert the master and show indicator state.
  domain: automation

  input:
    master_switch:
      name: Master physical switch (SW1)
      selector:
        entity:
          domain: switch

    slave_devices:
      name: Slave devices (button + indicator)
      description: Each slave light acts as both button and indicator
      selector:
        target:
          entity:
            domain: light
      default: []

    lock_boolean:
      name: Lock boolean to prevent recursion
      selector:
        entity:
          domain: input_boolean

mode: single

triggers:
  - trigger: event
    event_type: state_changed

actions:
  - variables:
      master: !input master_switch
      slaves: !input slave_devices
      lock: !input lock_boolean
      entity: "{{ trigger.event.data.entity_id }}"
      new_state: "{{ trigger.event.data.new_state.state if trigger.event.data.new_state else none }}"

  ###########################################################################
  # RECURSION LOCK
  ###########################################################################
  - alias: Prevent recursion
    if:
      - condition: state
        entity_id: !input lock_boolean
        state: "on"
    then: []
    else:
      - alias: Lock
        action: input_boolean.turn_on
        target:
          entity_id: !input lock_boolean

      - choose:

          ###################################################################
          # 1. MASTER SWITCH CHANGED → update all slave indicators
          ###################################################################
          - conditions:
              - condition: template
                value_template: "{{ entity == master }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ new_state == 'on' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input slave_devices

                  - conditions:
                      - condition: template
                        value_template: "{{ new_state == 'off' }}"
                    sequence:
                      - action: light.turn_off
                        target: !input slave_devices

          ###################################################################
          # 2. ANY SLAVE PRESSED → invert master + update indicators
          ###################################################################
          - conditions:
              - condition: template
                value_template: "{{ entity in slaves }}"
            sequence:
              - alias: Toggle master
                action: switch.toggle
                target:
                  entity_id: !input master_switch

              - delay: "00:00:01"

              - choose:
                  - conditions:
                      - condition: state
                        entity_id: !input master_switch
                        state: "on"
                    sequence:
                      - action: light.turn_on
                        target: !input slave_devices

                  - conditions:
                      - condition: state
                        entity_id: !input master_switch
                        state: "off"
                    sequence:
                      - action: light.turn_off
                        target: !input slave_devices

      - delay: "00:00:02"

      - alias: Unlock
        action: input_boolean.turn_off
        target:
          entity_id: !input lock_boolean
