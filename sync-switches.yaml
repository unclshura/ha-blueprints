blueprint:
  name: Master/Slave Switch Sync (Clean Trigger Version)
  description: >
    Master physical switch controls a dumb ceiling light.
    Slave logical switches invert the master and show indicator state.
  domain: automation

  input:
    master_switch:
      name: Master physical switch (SW1)
      selector:
        entity:
          domain: switch

    slave_devices:
      name: Slave devices (button + indicator)
      description: Each slave light acts as both button and indicator
      selector:
        target:
          entity:
            domain: light
      default: []

    lock_boolean:
      name: Lock boolean to prevent recursion
      selector:
        entity:
          domain: input_boolean

mode: single

triggers:
  - id: master_changed
    trigger: state
    entity_id: !input master_switch
    to:
      - "on"
      - "off"

  - id: slave_changed
    trigger: state
    entity_id: !input slave_devices
    to:
      - "on"
      - "off"

actions:
  ###########################################################################
  # RECURSION LOCK CHECK
  ###########################################################################
  - condition: state
    entity_id: !input lock_boolean
    state: "off"

  ###########################################################################
  # LOCK
  ###########################################################################
  - action: input_boolean.turn_on
    target:
      entity_id: !input lock_boolean

  ###########################################################################
  # MAIN LOGIC
  ###########################################################################
  - choose:

      #######################################################################
      # 1. MASTER SWITCH CHANGED → update slave indicators
      #######################################################################
      - conditions:
          - condition: trigger
            id: master_changed
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input master_switch
                    state: "on"
                sequence:
                  - action: light.turn_on
                    target: !input slave_devices

              - conditions:
                  - condition: state
                    entity_id: !input master_switch
                    state: "off"
                sequence:
                  - action: light.turn_off
                    target: !input slave_devices

      #######################################################################
      # 2. SLAVE SWITCH PRESSED → invert master + update indicators
      #######################################################################
      - conditions:
          - condition: trigger
            id: slave_changed
        sequence:
          - action: switch.toggle
            target:
              entity_id: !input master_switch

          - delay: "00:00:01"

          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input master_switch
                    state: "on"
                sequence:
                  - action: light.turn_on
                    target: !input slave_devices

              - conditions:
                  - condition: state
                    entity_id: !input master_switch
                    state: "off"
                sequence:
                  - action: light.turn_off
                    target: !input slave_devices

  ###########################################################################
  # FINAL DELAY BEFORE UNLOCK
  ###########################################################################
  - delay: "00:00:01"

  ###########################################################################
  # UNLOCK
  ###########################################################################
  - action: input_boolean.turn_off
    target:
      entity_id: !input lock_boolean
